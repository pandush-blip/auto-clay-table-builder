[project]
name = "tri-clay"
version = "0.1.0"
description = "Auto Clay Table Builder for The Revenue Inbox"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tri-clay = "tri_clay.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "webapp/tests"]
addopts = "-q"
